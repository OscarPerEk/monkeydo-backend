[tool.poetry]
name = "monkeydo-backend"
version = "0.1.0"
description = "MonkeyDo API — Active Recall Language Learning"
authors = []
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.12"
fastapi = "^0.115.5"
uvicorn = {extras = ["standard"], version = "^0.32.1"}
sqlalchemy = "^2.0.36"
alembic = "^1.14.0"
asyncpg = "^0.30.0"
pydantic-settings = "^2.6.1"
python-dotenv = "^1.0.1"
greenlet = "^3.3.2"
openai = "^1.40.0"

[tool.poetry.group.dev.dependencies]
httpx = "^0.27.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
